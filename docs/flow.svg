<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 398" width="1200" height="398" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Segoe UI',system-ui,sans-serif">
  <title id="t">How AH Quick Shots works</title>
  <desc id="d">The page in your browser sends your shots to a small program on your PC, which sends camera commands to Film Viewer. Film Viewer sends back flight paths and video; the program shows moments and previews on the page and saves finished videos in your Videos folder.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="1199" height="397" rx="6" fill="#fff" stroke="#dadce0"/>
  <text x="32" y="56" font-size="20" font-weight="600" fill="#202124">How AH Quick Shots works</text>

  <g fill="#fff" stroke="#dadce0">
    <rect x="32" y="88" width="280" height="166" rx="4"/>
    <rect x="888" y="88" width="280" height="166" rx="4"/>
    <rect x="460" y="302" width="280" height="64" rx="4"/>
    <rect x="888" y="302" width="280" height="64" rx="4"/>
  </g>
  <rect x="460" y="88" width="280" height="166" rx="4" fill="#eef2f9" stroke="#00308f" stroke-width="1.5"/>

  <g font-size="11" font-weight="600" letter-spacing="1.2" fill="#5f6368">
    <text x="52" y="120">YOU</text>
    <text x="480" y="120" fill="#00308f">AH QUICK SHOTS</text>
    <text x="908" y="120">ACES HIGH III</text>
  </g>
  <g font-size="17" font-weight="600" fill="#202124">
    <text x="52" y="148">The page in your browser</text>
    <text x="480" y="148">A small program on your PC</text>
    <text x="908" y="148">Film Viewer</text>
  </g>
  <g font-size="14" fill="#3c4043">
    <text x="52" y="180">Pick a fight from the list</text>
    <text x="52" y="204">Look at it through the cameras</text>
    <text x="52" y="228">Press Render</text>
    <text x="480" y="180">Turns your shots into the</text>
    <text x="480" y="204">viewer's camera commands</text>
    <text x="480" y="228">Keeps your cut and your videos</text>
    <text x="908" y="180">Plays your recorded film</text>
    <text x="908" y="204">Draws every picture</text>
    <text x="908" y="228">Renders the video with sound</text>
  </g>

  <g stroke="#5f6368" stroke-width="1.5" fill="none" marker-end="url(#head)">
    <path d="M320 152H452"/>
    <path d="M452 190H320"/>
    <path d="M748 152H880"/>
    <path d="M880 190H748"/>
    <path d="M600 262V294"/>
    <path d="M1028 294V262"/>
  </g>
  <g font-size="13" fill="#5f6368" text-anchor="middle">
    <text x="386" y="142">your shots</text>
    <text x="386" y="208">moments, previews</text>
    <text x="814" y="142">camera commands</text>
    <text x="814" y="208">flight paths, video</text>
  </g>

  <g font-size="14" font-weight="600" fill="#202124">
    <text x="480" y="328">Your Videos folder</text>
    <text x="908" y="328">Your recorded films</text>
  </g>
  <g font-size="13" fill="#5f6368">
    <text x="480" y="348">Finished videos, clearly named</text>
    <text x="908" y="348">The .ahf files the game saves</text>
  </g>
  <g font-size="14" fill="#5f6368">
    <text x="32" y="328">Everything stays on your computer.</text>
    <text x="32" y="348">The game itself is never touched.</text>
  </g>
</svg>
